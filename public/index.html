<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xat</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="/chat-config.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="chat">
      <h1 class="chat-title">Xat</h1>

      <form id="join-form" class="join-form" novalidate>
        <label for="name">Nom</label>
        <input id="name" name="name" type="text" autocomplete="nickname" maxlength="20" required>
        <label for="room-code">Codi de sala (per unir-se)</label>
        <input id="room-code" name="room-code" type="text" autocomplete="off" maxlength="6">
        <p id="room-error" class="error" role="alert"></p>
        <div class="room-actions">
          <button type="submit" value="create">Crear sala</button>
          <button type="submit" value="join">Unir-se a una sala</button>
        </div>
      </form>

      <section id="chat-room" class="chat-room" hidden aria-label="Xat">
        <header class="chat-header">
          <p>Nom: <span id="participant-name"></span></p>
          <p>Sala: <span id="room-code-display"></span></p>
          <p id="connection-status" class="connection-status" role="status">Desconnectat</p>
          <p id="recovery-status" role="status">Encara no hi ha hagut cap reconnexió.</p>
        </header>

        <div class="room-actions">
          <button id="simulate-disconnect" type="button">Simular tall del transport</button>
          <button id="leave-room" type="button">Abandonar la sala</button>
        </div>

        <div class="chat-content">
          <ol id="messages" class="messages" aria-label="Missatges" aria-live="polite"></ol>
          <aside class="participants-panel" aria-label="Participants de la sala">
            <h2>Participants</h2>
            <ul id="participants"></ul>
          </aside>
        </div>

        <form id="message-form" class="message-form">
          <label class="visually-hidden" for="message-input">Missatge</label>
          <input id="message-input" name="message" type="text" maxlength="500" autocomplete="off" required>
          <output id="character-count" for="message-input">0 / 500</output>
          <button id="send-button" type="submit" disabled>Enviar</button>
        </form>
        <p id="message-error" class="error" role="alert"></p>
      </section>
    </main>
  </body>
</html>
